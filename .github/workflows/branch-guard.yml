name: Branch guard

# main only accepts pull requests from develop.
on:
  pull_request:
    branches: [main]

jobs:
  source-is-develop:
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error::Pull requests into main must come from develop (got '${{ github.head_ref }}')."
            exit 1
          fi
